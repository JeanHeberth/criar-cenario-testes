services:
  backend:
    build:
      context: .
    ports:
      - "8089:8089"
    env_file:
      - .env
    environment:
      - MONGO_URI_NUVEM=${MONGO_URI_NUVEM}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ZEPHYR_ENABLED=${ZEPHYR_ENABLED:-false}
      - ZEPHYR_API_TOKEN=${ZEPHYR_API_TOKEN:-}
      - ZEPHYR_PROJECT_KEY=${ZEPHYR_PROJECT_KEY:-}
    networks:
      - rede-app

  frontend:
    build:
      context: ../../FrontEnd/gerar-cenario-teste-app
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - rede-app

networks:
  rede-app:
    driver: bridge
