name: Criar PR Develop para Main

on:
  pull_request:
    branches:
      - develop
    types:
      - closed
permissions:
  contents: read
  pull-requests: write

jobs:
  criar-pull-request:
    name: Criar PR para Main
    runs-on: ubuntu-latest

    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar ou localizar PR de develop para main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Já existe o Pull Request #$EXISTING_PR de develop para main."
            exit 0
          fi

          COMMITS_AHEAD=$(git rev-list --count origin/main..origin/develop)

          if [ "$COMMITS_AHEAD" -eq 0 ]; then
            echo "A branch develop não possui alterações novas em relação à main."
            exit 0
          fi

          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head develop \
            --title "Promover develop para main" \
            --body "Pull Request criado automaticamente após o merge de alterações na branch develop."

          echo "Pull Request de develop para main criado com sucesso."