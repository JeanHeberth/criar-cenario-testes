spring:
  application:
    name: criar-cenario-testes

  main:
    headless: false

  data:
    mongodb:
      uri: ${MONGO_URI_NUVEM}
      database: geradorcenarios

server:
  address: 0.0.0.0
  port: 8089
  error:
    include-message: always
    include-exception: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

agents:
  directory: ${AGENTS_DIRECTORY:}

ai:
  active-provider: ${AI_ACTIVE_PROVIDER:openai}
  fallback-provider: ${AI_FALLBACK_PROVIDER:gemini}

  openai:
    api-key: ${OPENAI_API_KEY}
    model: gpt-4.1
    url: https://api.openai.com/v1/chat/completions
    max-tokens: 4000

  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-2.5-flash
    url: https://generativelanguage.googleapis.com/v1beta/models
    max-tokens: 4000
    disable-thinking: ${GEMINI_DISABLE_THINKING:true}

  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${CLAUDE_MODEL:claude-opus-5}
    max-tokens: ${CLAUDE_MAX_TOKENS:16000}
    effort: ${CLAUDE_EFFORT:medium}
    thinking-enabled: ${CLAUDE_THINKING_ENABLED:true}
    thinking-headroom-tokens: ${CLAUDE_THINKING_HEADROOM_TOKENS:8000}
    timeout-seconds: ${CLAUDE_TIMEOUT_SECONDS:600}

jira:
  base-url: ${JIRA_BASE_URL:}
  email: ${JIRA_EMAIL:}
  api-token: ${JIRA_API_TOKEN:}
  issue-endpoint: /rest/api/3/issue

zephyr:
  enabled: ${ZEPHYR_ENABLED:false}
  base-url: ${ZEPHYR_BASE_URL:https://api.zephyrscale.smartbear.com/v2}
  api-token: ${ZEPHYR_API_TOKEN:}
  project-key: ${ZEPHYR_PROJECT_KEY:}
  default-status-name: ${ZEPHYR_DEFAULT_STATUS:Draft}
  default-priority-name: ${ZEPHYR_DEFAULT_PRIORITY:Normal}
  default-execution-status-name: ${ZEPHYR_DEFAULT_EXECUTION_STATUS:Not Executed}
  root-folder: ${ZEPHYR_ROOT_FOLDER:}
  allow-folder-creation: ${ZEPHYR_ALLOW_FOLDER_CREATION:true}

  # Deriva a pasta de destino de um campo da tarefa, em vez de config fixa.
  # Desligada por padrão: sem ligar, nada muda. Ver README.
  folder-strategy:
    enabled: ${ZEPHYR_FOLDER_STRATEGY_ENABLED:false}
    # Ordem de precedência. "components" é a fonte natural num Jira
    # corporativo; "summary" é degrau de migração para projetos que ainda
    # escrevem a stack no título e não preenchem campo estruturado.
    sources:
      - components
      - labels
    # Mapa FECHADO termo -> pasta: o que não está aqui não vira pasta nova,
    # cai no destino padrão. Comparação ignora caixa e acento.
    mapping:
      java: Java
      postman: Postman
      robot: Robot

logging:
  level:
    root: INFO
    br.com: DEBUG

auto-qa:
  enabled: true
  allowed-roots: []
  max-files: 500
  max-file-size-kb: 500
  max-total-content-kb: 5000
  max-generation-retries: 3
  max-execution-minutes: 10
  generated-directory: .auto-qa/generated
  backup-directory: .auto-qa/backups



  allow-command-execution: false
  allow-file-application: false
  sensitive-actions-enabled: false
  retention-days: 30
  max-concurrent-executions: 5
