spring:
  application:
    name: criar-cenario-testes

  main:
    headless: false

  data:
    mongodb:
      uri: ${MONGO_URI_NUVEM}
      database: geradorcenarios

server:
  address: 0.0.0.0
  port: 8089
  error:
    include-message: always
    include-exception: true

# CORS é infraestrutura global da aplicação (afeta Auto QA, Agent/Chat IA,
# Jira e Cenários via CorsConfig), por isso vive em "app", não em "auto-qa".
# Default vazio = fail-closed (nenhuma origem cross-origin autorizada) até
# que o ambiente configure explicitamente, ex.:
# APP_CORS_ALLOWED_ORIGINS=http://localhost:4200,http://100.83.72.100:9999
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

agents:
  directory: ${AGENTS_DIRECTORY:}

ai:
  active-provider: openai
  fallback-provider: gemini

  openai:
    api-key: ${OPENAI_API_KEY}
    model: gpt-4.1
    url: https://api.openai.com/v1/chat/completions
    max-tokens: 4000

  gemini:
    api-key: ${GEMINI_API_KEY}
    model: gemini-2.5-flash
    url: https://generativelanguage.googleapis.com/v1beta/models
    max-tokens: 4000

jira:
  base-url: ${JIRA_BASE_URL:}
  email: ${JIRA_EMAIL:}
  api-token: ${JIRA_API_TOKEN:}
  issue-endpoint: /rest/api/3/issue

# Publicação real dos cenários gerados como casos de teste no Zephyr Scale
# Cloud. Desabilitado por padrão (fail-closed, mesmo padrão de app.cors e
# auto-qa.allow-command-execution) - o ZephyrPublisherAgent só roda quando
# zephyr.enabled=true E as credenciais abaixo estiverem configuradas.
zephyr:
  enabled: ${ZEPHYR_ENABLED:false}
  base-url: ${ZEPHYR_BASE_URL:https://api.zephyrscale.smartbear.com/v2}
  api-token: ${ZEPHYR_API_TOKEN:}
  project-key: ${ZEPHYR_PROJECT_KEY:}
  default-status-name: ${ZEPHYR_DEFAULT_STATUS:Draft}
  default-priority-name: ${ZEPHYR_DEFAULT_PRIORITY:Normal}

logging:
  level:
    root: INFO
    br.com: DEBUG

auto-qa:
  enabled: true
  allowed-roots: []
  max-files: 500
  max-file-size-kb: 500
  max-total-content-kb: 5000
  max-generation-retries: 3
  max-execution-minutes: 10
  generated-directory: .auto-qa/generated
  backup-directory: .auto-qa/backups



  allow-command-execution: false
  allow-file-application: false
  sensitive-actions-enabled: false
  retention-days: 30
  max-concurrent-executions: 5
